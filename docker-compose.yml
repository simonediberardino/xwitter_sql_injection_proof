services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xwitter
      POSTGRES_PASSWORD: xwitter
      POSTGRES_DB: xwitter
    volumes:
      - xwitter_pg:/var/lib/postgresql/data
      - ./backend/internal/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xwitter -d xwitter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://xwitter:xwitter@db:5432/xwitter?sslmode=disable
      JWT_SECRET: change-this-to-a-long-random-secret
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  xwitter_pg:
